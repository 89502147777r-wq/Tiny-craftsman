# One-off (removed after use): searches Freesound (the key: the repository secret FREESOUND_API_KEY, never
# printed) for each line of sound-queries.txt — CC0 and CC BY only — and commits the candidates found.
name: Fetch Freesound sounds
on:
  push:
    branches: [fetch-sounds]
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          key = os.environ['KEY']; os.makedirs('incoming/snd', exist_ok=True); meta = {}
          for sid in open('sound-ids.txt').read().split():
              try:
                  d = json.load(urllib.request.urlopen(f'https://freesound.org/apiv2/sounds/{sid}/?fields=id,name,username,license,url,duration,previews&token={key}', timeout=30))
                  lic = d['license']
                  if 'nc' in lic.lower().split('/licenses/')[-1].split('/')[0]: print('skip NC', sid); continue
                  urllib.request.urlretrieve(d['previews']['preview-hq-ogg'], f'incoming/snd/{sid}.ogg')
                  meta[sid] = {k: d[k] for k in ('name', 'username', 'license', 'url', 'duration')}
              except Exception as e: meta[sid] = {'error': str(e)}
              time.sleep(0.6)
          json.dump(meta, open('incoming/snd/meta.json', 'w'), indent=1)
          print(len(meta))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add incoming; git commit -m "Freesound sounds" || true; git push
