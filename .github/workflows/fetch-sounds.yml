# One-off (removed after use): searches Freesound (the key: the repository secret FREESOUND_API_KEY, never
# printed) for each line of sound-queries.txt — CC0 and CC BY only — and commits the candidates found.
name: Search Freesound
on:
  push:
    branches: [fetch-sounds]
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search
        env:
          KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          key = os.environ['KEY']; out = {}
          lic = '(license:"Creative Commons 0" OR license:"Attribution")'
          for line in open('sound-queries.txt'):
              line = line.strip()
              if not line or '|' not in line: continue
              name, q = line.split('|', 1)
              u = 'https://freesound.org/apiv2/search/text/?' + urllib.parse.urlencode({'query': q, 'filter': lic + ' duration:[0.3 TO 120]', 'sort': 'score', 'page_size': 12, 'fields': 'id,name,username,license,duration,avg_rating,num_ratings,num_downloads,tags,previews,samplerate,channels', 'token': key})
              try: out[name] = json.load(urllib.request.urlopen(u, timeout=30))['results']
              except Exception as e: out[name] = {'error': str(e)}
              time.sleep(1.1)
          os.makedirs('incoming', exist_ok=True)
          json.dump(out, open('incoming/candidates.json', 'w'), indent=0)
          print(len(out), 'queries')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add incoming; git commit -m "Freesound candidates" || true; git push
