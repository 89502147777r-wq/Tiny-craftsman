# One-off (removed after use): searches Freesound (the key: the repository secret FREESOUND_API_KEY, never
# printed) for each line of sound-queries.txt — CC0 and CC BY only — and downloads the two best of each.
name: Fetch Freesound sounds
on:
  push:
    branches: [fetch-sounds]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search and download
        env:
          KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, time, math, urllib.parse, urllib.request
          key = os.environ['KEY']; os.makedirs('incoming/snd3', exist_ok=True); meta = {}
          lic = '(license:"Creative Commons 0" OR license:"Attribution")'
          for line in open('sound-queries.txt'):
              line = line.strip()
              if '|' not in line: continue
              name, q = line.split('|', 1)
              u = 'https://freesound.org/apiv2/search/text/?' + urllib.parse.urlencode({'query': q, 'filter': lic + ' duration:[0.5 TO 60]', 'sort': 'score', 'page_size': 15, 'fields': 'id,name,username,license,url,duration,avg_rating,num_ratings,num_downloads,previews', 'token': key})
              try: res = json.load(urllib.request.urlopen(u, timeout=30))['results']
              except Exception as e: meta[name] = {'error': str(e)}; continue
              res.sort(key=lambda r: -(r['avg_rating'] * min(1, r['num_ratings'] / 5) + math.log10(1 + r['num_downloads']) / 2))
              for r in res[:2]:
                  sid = str(r['id'])
                  try:
                      urllib.request.urlretrieve(r['previews']['preview-hq-ogg'], f'incoming/snd3/{sid}.ogg')
                      meta[sid] = {'for': name, **{k: r[k] for k in ('name', 'username', 'license', 'url', 'duration')}}
                  except Exception as e: meta[sid] = {'error': str(e)}
              time.sleep(1)
          json.dump(meta, open('incoming/snd3/meta.json', 'w'), indent=1)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add incoming; git commit -m "Freesound sounds 3" || true; git push
