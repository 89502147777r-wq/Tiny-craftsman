# One-off (removed after use): downloads the chosen CC BY models from Sketchfab with the repository secret SKETCHFAB_TOKEN,
# shrinks the photoscans for a phone right here (gltf-transform: weld, simplify, textures 1024 webp) and commits only the light
# files to this branch, in incoming/ (the 8k originals are far over git's file limit).
name: Fetch Sketchfab models
on:
  push:
    branches: [fetch-timber]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Download and shrink
        env:
          TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "SKETCHFAB_TOKEN is not set"; exit 1; fi
          mkdir -p incoming raw
          for pair in timber2:3be56e8955e24a848a457845f26461e4 timber1:90b1d493d2484a32915e1a688f92d1a8; do
            name=${pair%%:*}; uid=${pair##*:}
            curl -sS -H "Authorization: Token $TOKEN" "https://api.sketchfab.com/v3/models/$uid/download" -o dl.json
            url=$(python3 -c "import json;d=json.load(open('dl.json'));print((d.get('glb') or {}).get('url','') if isinstance(d,dict) else '')")
            if [ -z "$url" ]; then echo "no glb for $name: $(head -c 200 dl.json)"; continue; fi
            curl -sSL "$url" -o "raw/$name.glb"; ls -la "raw/$name.glb"
            npx -y @gltf-transform/cli@4 inspect "raw/$name.glb" | head -40 > "incoming/$name.inspect.txt" || true
            npx -y @gltf-transform/cli@4 optimize "raw/$name.glb" "incoming/$name.glb" --simplify true --simplify-ratio 0.06 --simplify-error 0.002 --texture-compress webp --texture-size 1024 --compress meshopt
            ls -la "incoming/$name.glb"
          done
          rm -f dl.json
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add incoming
          git commit -m "Downloaded and shrunk Sketchfab models (CC BY)" || echo "nothing downloaded"
          git push
