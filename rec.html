<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiny Craftsman — запись ролика</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; background: #121315; color: #f4f1ea; font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; box-sizing: border-box; }
  h1 { font-size: 18px; margin: 4px 0 0; }
  #stage { width: 360px; height: 640px; transform-origin: 50% 0; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.5); flex: none; }
  #stage iframe { width: 360px; height: 640px; border: 0; display: block; }
  #bar { width: min(360px, 100%); height: 8px; border-radius: 4px; background: #2a2c30; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #f2b134; transition: width 0.3s; }
  #msg { max-width: 360px; text-align: center; opacity: 0.9; }
  a.btn, button { font: inherit; font-weight: 700; color: #1b1406; background: #f2b134; border: 0; border-radius: 10px; padding: 12px 20px; text-decoration: none; cursor: pointer; }
  video { width: min(360px, 100%); border-radius: 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .ghost { background: #2a2c30; color: #f4f1ea; }
</style>
</head>
<body>
<h1 data-ru="Запись ролика" data-en="Recording the film">Запись ролика</h1>
<div id="msg" data-ru="Ролик проигрывается и записывается кадр за кадром прямо на этом устройстве. Не закрывайте страницу — на телефоне это несколько минут." data-en="The film plays and is recorded frame by frame right on this device. Keep the page open — on a phone it takes a few minutes.">…</div>
<div id="bar"><i></i></div>
<div id="stage"><iframe id="frame" title="film"></iframe></div>
<div class="row" id="after" hidden></div>
<script>
  // the film played in a phone-sized frame (360 × 640 at 3× = a 1080 × 1920 video); it reports here
  const EN = !/^ru/i.test(navigator.language || ''), L = (el) => el.dataset[EN ? 'en' : 'ru'];
  for (const el of document.querySelectorAll('[data-ru]')) el.textContent = L(el);
  if (EN) document.documentElement.lang = 'en';
  const film = new URLSearchParams(location.search).get('film') || 'pool', TOTAL = 1640;
  const fit = () => { const k = Math.min(1, (innerHeight - 190) / 640, (innerWidth - 32) / 360); document.getElementById('stage').style.transform = `scale(${Math.max(0.35, k)})`; document.getElementById('stage').style.marginBottom = `${-640 * (1 - Math.max(0.35, k))}px`; };
  fit(); addEventListener('resize', fit);
  document.getElementById('frame').src = `./?film=${film}&offline=1&rec=1&dpr=3&quality=high`;
  const msg = document.getElementById('msg'), bar = document.querySelector('#bar i'), after = document.getElementById('after');
  addEventListener('message', (e) => {
    const d = e.data; if (!d || !d.tcRec) return;
    if (d.error) {
      msg.textContent = d.error === 'no-webcodecs' || d.error === 'no-h264'
        ? (EN ? 'This browser cannot encode video (WebCodecs H.264). Use Chrome on Android or a computer, or Safari 17+.' : 'Этот браузер не умеет кодировать видео (WebCodecs H.264). Откройте в Chrome на Android или на компьютере, либо в Safari 17+.')
        : (EN ? 'Recording failed: ' : 'Запись прервалась: ') + d.error;
      return;
    }
    if (d.frame) {
      bar.style.width = Math.min(99, d.frame / TOTAL * 100).toFixed(1) + '%';
      msg.textContent = (EN ? 'Recording… ' : 'Запись… ') + `${d.t.toFixed(0)} / ~55 ${EN ? 's of film' : 'с ролика'} · ${Math.round(d.sec)} ${EN ? 's' : 'с'}`;
    }
    if (d.done) {
      bar.style.width = '100%';
      const url = URL.createObjectURL(d.blob), name = `tiny-craftsman-${film}.mp4`, mb = (d.blob.size / 1e6).toFixed(1);
      msg.textContent = (EN ? 'Done: ' : 'Готово: ') + `${d.w} × ${d.h}, ${(d.frames / 30).toFixed(0)} ${EN ? 's' : 'с'}, ${mb} MB — ${EN ? 'recorded in' : 'записано за'} ${Math.round(d.sec)} ${EN ? 's' : 'с'}`;
      document.getElementById('stage').hidden = true;
      after.hidden = false;
      after.innerHTML = '';
      const v = document.createElement('video'); v.src = url; v.controls = true; v.playsInline = true; v.loop = true;
      const a = document.createElement('a'); a.className = 'btn'; a.href = url; a.download = name; a.textContent = EN ? '⬇︎ Save the video' : '⬇︎ Сохранить видео';
      const share = document.createElement('button'); share.className = 'ghost'; share.textContent = EN ? 'Share…' : 'Поделиться…';
      share.onclick = async () => { try { await navigator.share({ files: [new File([d.blob], name, { type: 'video/mp4' })] }); } catch { a.click(); } };
      const back = document.createElement('a'); back.className = 'btn ghost'; back.href = './'; back.textContent = EN ? 'Back to the game' : 'Назад в игру';
      after.append(a); if (navigator.canShare?.({ files: [new File([d.blob], name, { type: 'video/mp4' })] })) after.append(share); after.append(back);
      document.body.insertBefore(v, after);
      a.click();
    }
  });
</script>
</body>
</html>
